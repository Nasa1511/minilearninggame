<html>

<head>
  <title>MLG</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

</head>

<body style="background-color: rgb(203, 221, 235);">
  
  
  
  <header>
    <h1 style="color: rgb(198, 215, 238);"><i><b>MLG</b></i></h1>
    
   
   
        
  </header>
 
<br>


<main class="quiz-container"> 
  
  <div style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <!-- Hier steht automatisch Frage: 1/9 -->
    <div id="frage-zaehler" style="font-weight: bold;">Frage: 1/9</div>
    
    <!-- Hier wird der Text der Frage eingefügt -->
    <h2 id="frage-text">Frage wird geladen...</h2>
    
    <!-- Button zum Weiterschalten -->
    <button id="weiter-btn" style="padding: 10px 20px; cursor: pointer;">Nächste Frage</button>
</div>

<script src="script.js"></script>

  <div class="quiz-card"> 
    <h2 id="frageHeadline">Frage</h2>
    <h2 id="frage"></h2>

     <input type="text" id="spielerEingabe"> 
      <button id="QuestionButton">Weiter</button> 
       <p id="ausgabe"></p> 

<textarea id="import-text" placeholder="Frage 1&#10:Frage 2"></textarea>
<button id="import-btn">Importieren</button>

<div id="frage-zaehler">Frage: 0/0</div>
<h2 id="frage-text">Noch keine Fragen geladen.</h2>
<button id="weiter-btn" disabled>Weiter</button>

<script src="script.js"></script>

    
  </div>
</main>

<script src="script.js"></script>
</body>


 <!-- Fußbereich -->
  <footer>
     
    <p style="color: rgb(198, 215, 238);" >2026 Mini-Learning-Game</p>
  </footer>

 </html>
